# Voice Desk: the ONE place to change anything voice-related for every agent.
#
# Peter 2026-10-22: "can all those that are like store inside of the Hermes profile like the voice
# type and all that be engineered into the voice desk as well". Change a value here, then
#
#     .venv/bin/python -m voicecfg check            # what differs from the live profiles (read-only)
#     .venv/bin/python -m voicecfg sync --dry-run   # the exact line changes it would make
#     .venv/bin/python -m voicecfg sync --apply     # back up, then write them
#
# sync writes each Hermes agent's values into ~/.hermes/profiles/<profile>/config.yaml (so the
# agent's own window AND its Telegram voice bubbles follow), Claude's into
# ~/.claude/voice-defaults.conf (read by ~/.claude/hooks/speak-response.sh), and Gemini's into
# ~/.gemini/config/hooks/voice-defaults.conf (read by Gemini's speak-response.py hook). Codex has no
# hook of its own: only Voice Desk speaks for it, straight from this file.
# The listener reads names, greetings, hint words and mic settings from here at start (restart it
# after changing those); voices are read fresh before every spoken line.
#
# Order of the [agents.*] blocks matters: it is the order names are matched and listed.
# Optional keys left out of an agent's block are simply not managed for that agent.

[shared]
# Peter 2026-11-02: ONLY "hello" wakes an agent ("hello Jarvis", "hello Kylie", ...). Short one-syllable
# greetings (hey, hi, ok, yo) were dropped on purpose. The extra spellings are how whisper writes "hello".
greetings = ["hello", "hallo", "hullo", "helo"]
# The words whisper is told to expect. Without it the small model hears "Javas", "Piley" and
# "Juanaba Faye" (measured 2026-10-21); with it all four names land. Mandarin stays Mandarin.
whisper_prompt = "Jarvis, Kylie, Esther, Wanna Buffet, Claude, Gemini, Codex. Mute, unmute."
# Voice Desk's own shared voice: used for any agent with no voice of its own below, and for
# everyone when the dashboard's V key turns per-agent voices off.
voice = "en-US-JennyNeural"
voice_zh = "zh-TW-HsiaoChenNeural"

[shared.mic]
# Microphone / silence detection for the listener and the window.
pre_roll_sec = 0.6              # audio kept from before speech was detected
speech_start_sec = 0.15         # how long sound must stay loud before it counts as speech (0.25 until 2026-10-31)
silence_send_sec = 1.5          # Peter's pause that acts as "send"
max_utterance_sec = 90          # hard stop so a stuck mic cannot record forever
min_speech_sec = 0.2            # anything shorter is a cough or a click (0.4 until 2026-10-31: a Bluetooth
                                # headset clips "Hi Claude" to ~0.3 s of loud sound, so it never woke)
noise_floor_start = 150.0       # int16 RMS guess before calibration
speech_over_floor = 3.0         # speech = louder than floor * this (and above min_speech_rms)
min_speech_rms = 250.0          # 350 until 2026-10-31; headsets send pure silence between words
barge_in_over_floor = 4.0       # while a reply plays the mic hears the speakers too, so be stricter
barge_in_sec = 0.5

[shared.end_phrases]
# The sentences that end a voice chat in a Hermes agent's window and hand the mic back to Voice
# Desk. Written into every profile's voice.stop_phrases as: always + (lead-in, phrase) for every
# lead-in and phrase, with every spelling of each word listed under `spellings`.
always = ["stop"]
lead_ins = ["", "oh", "okay", "ok", "thanks", "thank you"]
phrases = ["that's all", "that's all the questions i have", "that's all the question i have",
           "no further questions", "no further question"]
spellings = { "that's" = ["that's", "that is", "that’s"] }   # the last one has a phone's curly apostrophe

# ---- the agents --------------------------------------------------------------------------------
# names:     every spelling whisper has been heard to produce for the agent's name
# voice:     the reply voice. Hermes agents: written into the profile's active tts provider (and
#            tts.edge.voice when the profile has one). Claude and Gemini: NEURAL_VOICE_EN in their
#            voice-defaults.conf. Codex: read here by Voice Desk. Voice Desk speaks every agent's
#            turns with it too.
# voice_zh:  the Mandarin voice Voice Desk (and Claude's and Gemini's hooks) speak with; Taiwan
#            Mandarin (zh-TW-...) only, Peter 2026-11-09
# speed:     tts.edge.speed in the profile
# command, fallback, effect:
#            a non-Edge voice made by the agent's own script (Esther's and Simba's Kokoro), the Edge voice used if
#            that script fails, and (Simba only) the sound effect the script puts on top (F key on the grid)
# auto_tts, silence_duration, silence_threshold, barge_in, barge_in_grace_seconds:
#            the profile's voice-mode knobs (its top-level `voice:` block)
# Optional, stored and shown by the dashboard grid (nothing enforces them yet; add them by hand or with
# the grid's L / O keys):
# voices_extra:   more languages beyond English + Mandarin, e.g. voices_extra = { ja = "ja-JP-NanamiNeural" }
# voice_override: pin the language instead of following the reply: "auto" (default), "en", "zh" or an extra code
# quiet_hours:    per place, e.g. quiet_hours = { tg_dm = "22:00-07:00" }; places: terminal, tg_dm, tg_group,
#                 mic, iphone
# The grid's E / Z keys change `voice` / `voice_zh` here and run the same sync as `voicecfg sync --apply`
# (backup first, read back with Hermes' own parser); U undoes the last change.

[agents.claude]
target = "claude"
display = "Claude"
names = ["claude", "claud", "clod", "claude code", "克勞德", "克劳德"]
voice = "en-US-GuyNeural"          # Claude Code's spoken replies (NEURAL_VOICE_EN)
voice_zh = "zh-TW-HsiaoChenNeural"   # NEURAL_VOICE_ZH
always_on = true                     # VOICE_ALWAYS_ON: every Claude Code session starts with voice on
mode = "tap"                         # VOICE_MODE: tap Space to start, tap to send (Peter 2026-10-25; was hold)

[agents.gemini]
target = "gemini"
display = "Gemini"
names = ["gemini", "jemini", "google gemini"]
voice = "en-US-AriaNeural"
voice_zh = "zh-TW-HsiaoYuNeural"

[agents.codex]
target = "codex"
display = "Codex"
names = ["codex", "code x", "openai codex"]
voice = "en-GB-RyanNeural"
voice_zh = "zh-TW-YunJheNeural"

# Simba (Peter 2026-11-10): a girl cat with a scratchy, smoky witch voice, American accent only, made by Kokoro.
# Voice only: Simba is not a brain Voice Desk talks to ("hello Simba" wakes nothing, so she is not in
# whisper_prompt), and nothing in Voice Desk makes her speak; this block is her voice, ready for whatever does.
# voice  = an American female Kokoro voice (af_...), E key; effect = smoky / raspy / plain, F key.
# Jarvis's numbered samples: 1 nicole smoky, 2 nicole raspy, 3 kore smoky, 4 kore raspy, 5 river smoky,
# 6 river raspy, 7 jessica smoky, 8 jessica raspy, 9 nova smoky, 10 nova raspy (simba_tts.SAMPLES).
[agents.simba]
target = "simba"
display = "Simba"
names = ["simba"]
voice = "af_nicole"                  # sample 1, a placeholder until Peter picks his sample
effect = "smoky"
voice_zh = "zh-TW-HsiaoYuNeural"     # Kokoro speaks English only; her Mandarin lines use this Taiwan Edge voice
# Voice Desk speaks her English lines through: <command> <text file> <out.wav> <voice> <effect>
command = ["~/Desktop/Peter_Tax/tax_engine/venv/bin/python", "~/GitHub/Voice_Desk/simba_tts.py"]
fallback = "en-US-MichelleNeural"    # only if Kokoro fails, so the line never goes silent (no effect on it)

[agents.jarvis]
profile = "orchestrator"
display = "Jarvis"
names = ["jarvis", "javis", "jaarvis", "javas", "jervis", "jarvas", "orchestrator"]
voice = "en-US-JennyNeural"
voice_zh = "zh-TW-HsiaoChenNeural"
speed = 1.0
auto_tts = true
silence_duration = 1.5
silence_threshold = 450               # live value Peter has been running (was 200 here until 2026-11-09)
barge_in = false

[agents.kylie]
profile = "assistant"
display = "Kylie"
names = ["kylie", "kiley", "kylee", "kyley", "kailey", "kaylee", "kayley", "kaley", "kyli", "kylie's", "assistant"]
voice = "en-US-AvaNeural"
voice_zh = "zh-TW-HsiaoChenNeural"
speed = 1.0
auto_tts = true
silence_duration = 1.5
silence_threshold = 200
barge_in = false

[agents.esther]
profile = "tax_angel_esther"
display = "Esther"
names = ["esther", "ester", "tax angel esther", "tax angel"]
voice = "alloy"                      # her Kokoro voice, everywhere (Peter 2026-10-22)
voice_zh = "zh-TW-HsiaoYuNeural"     # Kokoro speaks English only; her Mandarin lines use this Edge voice
# Voice Desk speaks her lines through her own Kokoro script: <command> <text file> <out.wav> <voice>
command = ["~/Desktop/Peter_Tax/tax_engine/venv/bin/python",
           "~/.hermes/profiles/tax_angel_esther/scripts/esther_tts.py"]
fallback = "en-US-AriaNeural"        # only if Kokoro fails, so the line never goes silent
auto_tts = true
silence_duration = 1.5
barge_in = false
barge_in_grace_seconds = 0.5

[agents.wanna_buffet]
profile = "wanna-buffet"
display = "Wanna Buffet"
names = ["wanna buffet", "wanna buffett", "wannabuffet", "wana buffet", "wanna buff it", "warren buffett", "warren buffet"]
voice = "en-US-AndrewNeural"
voice_zh = "zh-TW-YunJheNeural"
speed = 0.92
auto_tts = true
silence_threshold = 500
barge_in = false
